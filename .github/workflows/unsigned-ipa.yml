name: Build unsigned IPA (no Mac needed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "XContainer/**"
      - "XContainer.xcodeproj/**"
      - ".github/workflows/unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Show project targets
        run: xcodebuild -list -project XContainer.xcodeproj

      - name: Archive (unsigned)
        run: |
          set -e
          rm -rf build
          xcodebuild \
            -project XContainer.xcodeproj \
            -target XContainer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/XContainer.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/XContainer.xcarchive/Products/Applications/XContainer.app"
          ls -la "$APP_PATH"
          rm -rf Payload XContainer-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r XContainer-unsigned.ipa Payload
          ls -lh XContainer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XContainer-unsigned-ipa
          path: XContainer-unsigned.ipa
          if-no-files-found: error
