name: Build unsigned IPA (no Mac needed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "XContainer/**"
      - "XContainer.xcodeproj/**"
      - ".github/workflows/unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Show project targets
        run: xcodebuild -list -project XContainer.xcodeproj

      - name: Debug parse check (goes into build.log)
        run: |
          rm -f build.log
          md5sum XContainer/*.swift | tee -a build.log
          head -8 XContainer/ModuleStore.swift | tee -a build.log
          for f in XContainer/*.swift; do
            echo "=== PARSE $f ===" | tee -a build.log
            xcrun swiftc -frontend -parse "$f" >> build.log 2>&1 || echo "PARSE-FAILED: $f" | tee -a build.log
          done

      - name: Build (unsigned)
        run: |
          set -e
          rm -rf build
          # NOTE: plain `build` (not `archive`) on purpose — this repo has no
          # shared .xcscheme, and `archive` + `-archivePath` requires `-scheme`.
          set -o pipefail
          xcodebuild \
            -project XContainer.xcodeproj \
            -target XContainer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee -a build.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/app/XContainer.app"
          ls -la "$APP_PATH"
          rm -rf Payload XContainer-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r XContainer-unsigned.ipa Payload
          ls -lh XContainer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XContainer-unsigned-ipa
          path: XContainer-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
